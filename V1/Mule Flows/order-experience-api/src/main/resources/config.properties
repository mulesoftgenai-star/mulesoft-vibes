# Order Experience API Configuration Properties

# HTTP Listener Configuration
http.host=0.0.0.0
http.port=8081

# Order Process API Configuration
order.process.api.host=localhost
order.process.api.port=8082
order.process.api.basePath=/process/v1
order.process.api.url=https://localhost:8082/process/v1
order.process.api.client.id=order-experience-api-client
order.process.api.client.secret=experience-api-secret

# Database Configuration
db.url=jdbc:postgresql://localhost:5432/order_management
db.driverClassName=org.postgresql.Driver
db.user=orderuser
db.password=orderpass

# Logging Configuration
logging.level=INFO

# Security Configuration
security.client.id.enforcement=true

# API Configuration
api.version=v1.0
api.name=Order Experience API