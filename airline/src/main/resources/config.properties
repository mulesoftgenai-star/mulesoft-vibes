# Application Configuration Properties
# This file contains configurable properties for the American Airlines API

# HTTP Configuration
http.host=0.0.0.0
http.port=8083

# Database Configuration
db.driver=org.h2.Driver
db.url=jdbc:h2:file:./data/airline_db;MODE=MySQL;AUTO_SERVER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS airline
db.username=sa
db.password=

# Email Configuration
email.smtp.host=smtp.gmail.com
email.smtp.port=587
email.smtp.username=test@example.com
email.smtp.password=password

# Batch Processing Configuration
batch.input.directory=/tmp/flights

# Notification API Configuration
notification.api.host=localhost
notification.api.port=8081

# Salesforce Configuration
# Please replace with your actual Salesforce credentials
salesforce.username=your-salesforce-username@domain.com
salesforce.password=your-salesforce-password
salesforce.security.token=your-salesforce-security-token
salesforce.url=https://login.salesforce.com/services/Soap/u/60.0