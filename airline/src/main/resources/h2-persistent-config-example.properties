# H2 File-Based Configuration Example
# Replace current db.url in application.properties with this to enable persistence:

# Current (In-Memory) - Data lost on restart
db.url=jdbc:h2:mem:airline_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# File-Based (Persistent) - Data saved to disk
# db.url=jdbc:h2:file:./data/airline_db;MODE=MySQL;AUTO_SERVER=TRUE

# Server Mode (Shared) - Requires H2 server running
# db.url=jdbc:h2:tcp://localhost:9092/airline_db

# Files will be created in:
# - In-Memory: No files
# - File-Based: ./data/airline_db.mv.db (and .trace.db)  
# - Server Mode: In H2 server's data directory

# H2 Console Access (all modes):
# URL: http://localhost:8082/h2-console
# JDBC URL: Same as db.url above
# Username: sa
# Password: (empty)