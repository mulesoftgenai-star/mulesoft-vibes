# Batch Processing Configuration
batch.input.directory=/tmp/flights
batch.notification.email=admin@company.com

# Email Configuration
email.user=your-email@gmail.com
email.password=your-app-password

# H2 Persistent File-Based Database Configuration
db.host=localhost
db.port=9092
db.database=file:./data/airline_db
db.user=sa
db.password=
db.url=jdbc:h2:file:./data/airline_db;MODE=MySQL;AUTO_SERVER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS airline
db.driver=org.h2.Driver

# H2 Console Configuration (for development/debugging)
h2.console.enabled=true
h2.console.port=8082
h2.console.path=/h2-console

# Notification System API Configuration
notification.api.host=localhost
notification.api.port=8082
notification.api.base.path=/api/notifications

# Circuit Breaker Configuration
circuit.breaker.failure.threshold=5
circuit.breaker.success.threshold=3
circuit.breaker.timeout=30000
circuit.breaker.half.open.timeout=60000

# Database Connection Pool Configuration
db.pool.min.size=2
db.pool.max.size=10
db.connection.timeout=5000
db.query.timeout=30000

# Retry Configuration
db.retry.count=3
db.retry.delay=1000
