# Order Process API Configuration

# HTTP Listener Configuration
http.host=0.0.0.0
http.port=8082

# Customer System API Configuration
customer.api.host=localhost
customer.api.port=8083
customer.api.basepath=/api/v1

# Inventory System API Configuration
inventory.api.host=localhost
inventory.api.port=8084
inventory.api.basepath=/api/v1

# Payment System API Configuration
payment.api.host=localhost
payment.api.port=8085
payment.api.basepath=/api/v1

# Shipping System API Configuration
shipping.api.host=localhost
shipping.api.port=8086
shipping.api.basepath=/api/v1

# Database Configuration
db.host=localhost
db.port=5432
db.database=oms_db
db.username=${secure::db.username}
db.password=${secure::db.password}

# Security Configuration
oauth2.client.id=${secure::oauth2.client.id}
oauth2.client.secret=${secure::oauth2.client.secret}
oauth2.token.url=${secure::oauth2.token.url}

# Transaction Configuration
transaction.timeout=60000
circuit.breaker.threshold=50
circuit.breaker.timeout=30000

# Logging Configuration
logging.level=INFO

# API Metadata
api.name=Order Process API
api.version=v1.0.0
api.description=Process layer API for order orchestration and business logic