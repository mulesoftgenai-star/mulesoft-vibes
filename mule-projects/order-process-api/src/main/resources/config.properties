# Order Process API Configuration Properties
# HTTP Listener Configuration
http.host=0.0.0.0
http.port=8082

# Customer System API Configuration
api.customer.host=localhost
api.customer.port=8083
api.customer.protocol=HTTP
api.customer.basePath=/api/v1

# Inventory System API Configuration
api.inventory.host=localhost
api.inventory.port=8084
api.inventory.protocol=HTTP
api.inventory.basePath=/api/v1

# Payment System API Configuration
api.payment.host=localhost
api.payment.port=8085
api.payment.protocol=HTTP
api.payment.basePath=/api/v1

# Shipping System API Configuration
api.shipping.host=localhost
api.shipping.port=8086
api.shipping.protocol=HTTP
api.shipping.basePath=/api/v1

# Transaction Configuration
transaction.timeout=300000
transaction.retry.maxAttempts=3
transaction.retry.delay=2000

# Circuit Breaker Configuration
circuitBreaker.enabled=true
circuitBreaker.failureThreshold=5
circuitBreaker.timeout=30000
circuitBreaker.resetTimeout=60000

# Database Configuration
db.host=localhost
db.port=5432
db.name=order_process
db.username=app_user
db.password=changeme

# Message Queue Configuration
mq.host=localhost
mq.port=5672
mq.username=admin
mq.password=changeme

# Security Configuration
security.oauth.enabled=true
security.oauth.tokenUrl=https://auth.company.com/oauth2/token
security.oauth.clientId=order-process-api
security.oauth.clientSecret=changeme

# Logging Configuration
logging.level=INFO
logging.correlationId.enabled=true
logging.audit.enabled=true

# Monitoring Configuration
monitoring.metrics.enabled=true
monitoring.healthcheck.enabled=true
monitoring.alerts.enabled=true

# Environment Configuration
environment=dev
application.name=order-process-api
application.version=1.0.0