# Order Experience API Configuration

# HTTP Listener Configuration
http.host=0.0.0.0
http.port=8081

# Process API Configuration  
process.api.host=localhost
process.api.port=8082
process.api.protocol=HTTP
process.api.basepath=/api/v1

# Security Configuration
oauth2.client.id=${secure::oauth2.client.id}
oauth2.client.secret=${secure::oauth2.client.secret}
oauth2.token.url=${secure::oauth2.token.url}

# Logging Configuration
logging.level=INFO

# API Metadata
api.name=Order Experience API
api.version=v1.0.0
api.description=Customer-facing API for order management operations