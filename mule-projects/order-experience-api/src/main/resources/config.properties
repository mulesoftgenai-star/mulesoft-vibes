# Order Experience API Configuration Properties
# HTTP Listener Configuration
http.host=0.0.0.0
http.port=8081

# Order Process API Configuration
api.process.host=localhost
api.process.port=8082
api.process.protocol=HTTP
api.process.basePath=/api/v1

# Security Configuration
security.oauth.enabled=true
security.oauth.tokenUrl=https://auth.company.com/oauth2/token
security.oauth.clientId=order-experience-api
security.oauth.clientSecret=changeme

# Rate Limiting Configuration
rateLimit.enabled=true
rateLimit.maxRequests=1000
rateLimit.timeWindow=60

# Logging Configuration
logging.level=INFO
logging.correlationId.enabled=true

# Error Handling Configuration
error.notification.enabled=true
error.notification.email=support@company.com

# Cache Configuration
cache.enabled=true
cache.ttl=300

# Database Configuration (if needed for local caching)
db.host=localhost
db.port=5432
db.name=order_experience
db.username=app_user
db.password=changeme

# Environment Configuration
environment=dev
application.name=order-experience-api
application.version=1.0.0